<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLENKER-AI MINI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a24; color: #ffffff; display: flex; flex-direction: column; justify-content: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .chat-container { width: 100%; max-width: 600px; margin: 0 auto; background: #222232; border-radius: 16px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        h2 { margin-top: 0; color: #00ffcc; text-align: center; font-size: 24px; }
        .settings, .input-area { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        input, button, select, textarea { padding: 14px; border-radius: 10px; border: 1px solid #3d3d5c; background: #2d2d42; color: white; font-size: 16px; outline: none; }
        input:focus, textarea:focus { border-color: #00ffcc; }
        button { background: #00ffcc; color: #12121a; cursor: pointer; font-weight: bold; border: none; }
        .output { margin-top: 15px; padding: 15px; background: #1a1a24; border-radius: 10px; border: 1px solid #2d2d42; min-height: 60px; max-height: 220px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>KLENKER-AI MINI</h2>
    
    <div class="settings">
        <input type="password" id="hfToken" placeholder="Вставь бесплатный токен Hugging Face (hf_...)">
        <label for="voiceSelect">Выбери мужской голос:</label>
        <select id="voiceSelect"><option>Загрузка голосов...</option></select>
    </div>

    <div class="input-area">
        <textarea id="userInput" rows="3" placeholder="Задай вопрос KLENKER-AI..."></textarea>
        <button id="sendBtn">Спросить KLENKER-AI</button>
    </div>

    <div class="output" id="chatOutput">Система готова. Введите токен hf_... и задайте вопрос.</div>
</div>

<script>
    const voiceSelect = document.getElementById('voiceSelect');
    const chatOutput = document.getElementById('chatOutput');
    let voices = [];

    function loadVoices() {
        voices = window.speechSynthesis.getVoices();
        voiceSelect.innerHTML = '';
        const ruVoices = voices.filter(voice => voice.lang.includes('ru'));
        if (ruVoices.length === 0) {
            voiceSelect.innerHTML = '<option value="">Русские голоса не найдены</option>';
            return;
        }
        ruVoices.forEach(voice => {
            const option = document.createElement('option');
            option.value = voice.name;
            option.textContent = voice.name;
            voiceSelect.appendChild(option);
        });
    }

    if (window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 500);

    function speakText(text) {
        const cleanText = text.replace(/[*#`_-]/g, '');
        window.speechSynthesis.cancel(); 
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'ru-RU';
        const selectedVoice = voices.find(v => v.name === voiceSelect.value);
        if (selectedVoice) utterance.voice = selectedVoice;
        window.speechSynthesis.speak(utterance);
    }

    document.getElementById('sendBtn').addEventListener('click', async () => {
        const token = document.getElementById('hfToken').value.trim();
        const textInput = document.getElementById('userInput').value.trim();

        if (!token) { alert('Пожалуйста, вставь токен hf_...'); return; }
        if (!textInput) return;

        chatOutput.textContent = 'KLENKER-AI думает...';

        try {
            // Запрос к бесплатной и мощной модели Qwen-2.5 от Alibaba через Hugging Face
            const response = await fetch('https://huggingface.co', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    inputs: `<|im_start|>system\nТебя зовут KLENKER-AI MINI. Ты умный ИИ. Отвечай кратко, на русском языке.<|im_end|>\n<|im_start|>user\n${textInput}<|im_end|>\n<|im_start|>assistant\n`,
                    parameters: { max_new_tokens: 150 }
                })
            });

            const data = await response.json();
            
            if (data.error) {
                chatOutput.textContent = 'Ошибка: ' + data.error;
                return;
            }

            let aiResponse = data[0].generated_text;
            // Отрезаем промпт, оставляем только чистый ответ ИИ
            aiResponse = aiResponse.split('<|im_start|>assistant\n')[1] || aiResponse;
            aiResponse = aiResponse.replace('<|im_end|>', '').trim();

            chatOutput.textContent = aiResponse;
            speakText(aiResponse);

        } catch (error) {
            chatOutput.textContent = 'Ошибка сети. Попробуй еще раз.';
            console.error(error);
        }
    });
</script>

</body>
</html>
